name: Bug report
description: Something in FACE does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: FACE version
      description: The version at the bottom of the FACE home, or the output of `face --version`.
      placeholder: "2026.10.12"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - macOS (Apple Silicon)
        - Linux x86_64
        - Linux arm64
        - Windows x86_64
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: The agent of the session where it happened, or None.
      options:
        - Claude Code
        - Codex
        - Copilot
        - Cursor
        - Antigravity
        - OpenCode
        - Qwen Code
        - None
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Optional. What `face` printed in the terminal, without tokens or other secrets.
      render: text
    validations:
      required: false
